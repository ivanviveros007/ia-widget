name: QuotaGarden
options:
  bundleIdPrefix: dev.bambam
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
targets:
  QuotaGarden:
    type: application
    platform: macOS
    sources:
      - native/Shared
      - native/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bambam.QuotaGarden
        PRODUCT_NAME: Cuota IA
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cuota IA
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
    dependencies:
      - target: QuotaWidget
        embed: true
  QuotaWidget:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - native/Shared
      - native/Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bambam.QuotaGarden.Widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: native/Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: native/Widget/Widget.entitlements
        SKIP_INSTALL: YES
schemes:
  QuotaGarden:
    build:
      targets:
        QuotaGarden: all
